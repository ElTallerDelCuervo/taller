<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UNIVERSO — RAYCASTER 2.5D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#galaxyCanvas{
    z-index:1;
}

#worldCanvas{
    z-index:2;
    display:none;
}

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 5px #000;
}

#title{
    position:absolute;
    top:16px;
    left:18px;
    font-size:12px;
    letter-spacing:4px;
    opacity:.8;
}

#stats{
    position:absolute;
    top:45px;
    left:18px;
    font-size:10px;
    line-height:1.7;
    opacity:.7;
}

#target{
    position:absolute;
    left:50%;
    top:15%;
    transform:translateX(-50%);
    text-align:center;
    opacity:0;
    transition:.35s;
}

#targetName{
    font-size:18px;
    letter-spacing:3px;
}

#targetType{
    font-size:10px;
    margin-top:6px;
    opacity:.7;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    opacity:.5;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:1px;
    height:16px;
    left:7px;
}

#crosshair:after{
    height:1px;
    width:16px;
    top:7px;
}

#spaceControls{
    position:absolute;
    right:18px;
    bottom:18px;
    display:flex;
    gap:8px;
    pointer-events:auto;
}

button{
    color:white;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.35);
    border-radius:8px;
    padding:10px 14px;
    font-size:10px;
    cursor:pointer;
    backdrop-filter:blur(5px);
}

button:hover{
    background:rgba(255,255,255,.15);
}

#ship{
    position:absolute;
    z-index:15;
    left:50%;
    bottom:3%;
    width:180px;
    height:115px;
    transform:translateX(-50%);
    pointer-events:none;
    transition:transform .2s;
}

.hull{
    position:absolute;
    left:20px;
    bottom:0;
    width:140px;
    height:35px;
    background:linear-gradient(#70492e 0 25%,#28160d 25%);
    border:2px solid #bb8547;
    clip-path:polygon(4% 0,96% 0,82% 100%,18% 100%);
    box-shadow:0 0 18px #9a5d25;
}

.deck{
    position:absolute;
    left:40px;
    bottom:29px;
    width:100px;
    height:12px;
    background:#a66f39;
    border:2px solid #d2a25f;
}

.mast{
    position:absolute;
    left:84px;
    bottom:37px;
    width:7px;
    height:75px;
    background:#9d6732;
}

.sail{
    position:absolute;
    left:91px;
    bottom:54px;
    width:62px;
    height:55px;
    background:linear-gradient(135deg,#e2d2a8,#806d4c);
    clip-path:polygon(0 0,100% 15%,100% 100%,0 80%);
    filter:drop-shadow(0 0 8px #8d7048);
}

.sail2{
    position:absolute;
    left:29px;
    bottom:56px;
    width:55px;
    height:43px;
    background:linear-gradient(135deg,#bca980,#62543c);
    clip-path:polygon(0 10%,100% 0,100% 85%,0 100%);
    opacity:.75;
}

/* =========================
   WORLD HUD
========================= */

#worldHud{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    color:white;
}

#worldTitle{
    position:absolute;
    top:16px;
    left:18px;
    font-size:11px;
    letter-spacing:3px;
    opacity:.75;
}

#worldStats{
    position:absolute;
    top:43px;
    left:18px;
    font-size:10px;
    line-height:1.7;
    opacity:.7;
}

#minimap{
    position:absolute;
    right:15px;
    top:15px;
    width:145px;
    height:145px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.35);
}

#worldControls{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:125px;
    height:125px;
    border:2px solid rgba(255,255,255,.22);
    border-radius:50%;
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.4);
}

.worldButton{
    position:absolute;
    pointer-events:auto;
    touch-action:none;
    width:65px;
    height:65px;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.4);
}

#jump{
    right:28px;
    bottom:115px;
}

#dash{
    right:105px;
    bottom:32px;
}

#backGalaxy{
    right:20px;
    bottom:20px;
    width:auto;
    height:auto;
    border-radius:7px;
    padding:9px 12px;
}

#fade{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s;
}

#arrivalText{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:110;
    color:white;
    font-size:16px;
    letter-spacing:5px;
    opacity:0;
    text-align:center;
    pointer-events:none;
}

#arrivalSub{
    margin-top:10px;
    font-size:9px;
    letter-spacing:2px;
    opacity:.6;
}

@media(max-width:600px){
    #title{
        font-size:9px;
    }

    #ship{
        transform:translateX(-50%) scale(.75);
        bottom:1%;
    }

    #minimap{
        width:115px;
        height:115px;
    }
}
</style>
</head>

<body>

<canvas id="galaxyCanvas"></canvas>
<canvas id="worldCanvas"></canvas>

<div id="hud">

    <div id="title">UNIVERSO EXPLORABLE</div>

    <div id="stats">
        SECTOR <span id="sector">0000</span><br>
        DISTANCIA <span id="distance">0</span><br>
        VELOCIDAD <span id="speed">1.0</span>
    </div>

    <div id="target">
        <div id="targetName"></div>
        <div id="targetType"></div>
    </div>

    <div id="crosshair"></div>

    <div id="spaceControls">
        <button id="pause">PAUSAR</button>
        <button id="newUniverse">NUEVO UNIVERSO</button>
    </div>

    <div id="ship">
        <div class="sail2"></div>
        <div class="sail"></div>
        <div class="mast"></div>
        <div class="deck"></div>
        <div class="hull"></div>
    </div>

</div>

<div id="worldHud">

    <div id="worldTitle">
        EXPLORACIÓN PLANETARIA // RAYCASTER 2.5D
    </div>

    <div id="worldStats">
        PLANETA: <span id="planetName">---</span><br>
        POSICIÓN: <span id="worldPos">0, 0</span>
    </div>

    <canvas id="minimap"></canvas>

    <div id="worldControls">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button class="worldButton" id="jump">
            SALTO
        </button>

        <button class="worldButton" id="dash">
            DASH
        </button>

        <button id="backGalaxy">
            ↑ UNIVERSO
        </button>

    </div>

</div>

<div id="fade"></div>

<div id="arrivalText">
    ENTRANDO EN EL SISTEMA
    <div id="arrivalSub"></div>
</div>

<script>
"use strict";

/* ==========================================================
   CANVAS
========================================================== */

const galaxyCanvas =
    document.getElementById("galaxyCanvas");

const gctx =
    galaxyCanvas.getContext("2d");

const worldCanvas =
    document.getElementById("worldCanvas");

const wctx =
    worldCanvas.getContext("2d");

const mini =
    document.getElementById("minimap");

const mctx =
    mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    galaxyCanvas.width=W;
    galaxyCanvas.height=H;

    worldCanvas.width=W;
    worldCanvas.height=H;

    mini.width=145;
    mini.height=145;
}

addEventListener("resize",resize);
resize();


/* ==========================================================
   SEMILLA
========================================================== */

let seed=
    Number(localStorage.getItem("UNIVERSE_SEED")) ||
    Math.floor(Math.random()*999999999);

localStorage.setItem("UNIVERSE_SEED",seed);


/* ==========================================================
   RANDOM DETERMINISTA
========================================================== */

function hash(n){

    n=Math.sin(n*12.9898+78.233)*43758.5453123;

    return n-Math.floor(n);
}

function random(seed,a,b){
    return a+hash(seed)*(b-a);
}

function choice(seed,array){
    return array[
        Math.floor(hash(seed)*array.length)
    ];
}


/* ==========================================================
   ESTADO GALAXIA
========================================================== */

let shipDistance=0;
let shipSpeed=1;
let paused=false;

let galaxyObjects=[];

let sectorActual=-999;

const SECTOR_SIZE=1800;


/* ==========================================================
   TIPOS
========================================================== */

const TYPES=[
    "star",
    "star",
    "star",
    "planet",
    "planet",
    "asteroid",
    "comet",
    "nebula",
    "nebula",
    "galaxy",
    "pulsar",
    "quasar",
    "blackhole",
    "supernova",
    "anomaly"
];

const palettes=[
    ["#ff512f","#ffcc66","#fff4d0"],
    ["#38d9ff","#6f63ff","#ffffff"],
    ["#ff3cac","#8b5cf6","#e9d5ff"],
    ["#3fffd0","#17b99d","#efffff"],
    ["#ff8b00","#ffd000","#fff2bd"],
    ["#b477ff","#6d28d9","#f1ddff"],
    ["#ef4444","#991b1b","#ffd5d5"]
];


/* ==========================================================
   GENERACIÓN DE OBJETOS
========================================================== */

function generateSector(s){

    const arr=[];

    const base=
        seed*.00001+
        s*9187.317;

    const count=
        Math.floor(60+hash(base)*45);

    for(let i=0;i<count;i++){

        const rs=
            base+i*731.71;

        let type;

        const rarity=hash(rs+100);

        if(rarity<.006)
            type="blackhole";

        else if(rarity<.015)
            type="quasar";

        else if(rarity<.032)
            type="pulsar";

        else if(rarity<.055)
            type="galaxy";

        else if(rarity<.11)
            type="nebula";

        else
            type=choice(rs,TYPES);

        arr.push({

            id:s+"_"+i,

            sector:s,

            type,

            x:random(rs,-W*.9,W*.9),

            y:random(rs+10,-H*.8,H*.8),

            depth:random(rs+20,.15,1),

            size:random(rs+30,.35,1.8),

            rotation:random(rs+40,0,Math.PI*2),

            phase:random(rs+50,0,Math.PI*2),

            palette:choice(rs+60,palettes),

            seed:rs,

            discovered:false

        });
    }

    /*
       Gran nebulosa especial
    */

    if(hash(base+999)<.55){

        arr.push({

            id:s+"_special_nebula",

            sector:s,

            type:"nebula",

            x:random(base+500,-W*.6,W*.6),

            y:random(base+600,-H*.5,H*.5),

            depth:.6,

            size:random(base+700,3,6),

            rotation:random(base+800,0,6.28),

            phase:0,

            palette:choice(base+900,palettes),

            seed:base+1000,

            discovered:false

        });
    }

    return arr;
}


function updateGalaxy(){

    const s=
        Math.floor(shipDistance/SECTOR_SIZE);

    if(s===sectorActual)
        return;

    sectorActual=s;

    galaxyObjects=[];

    for(let i=s-2;i<=s+3;i++){

        if(i>=0)
            galaxyObjects.push(
                ...generateSector(i)
            );
    }

    document.getElementById("sector")
        .textContent=
        String(s).padStart(4,"0");
}


/* ==========================================================
   PROYECCIÓN GALÁCTICA
========================================================== */

function projectGalaxy(o){

    const relative=
        o.sector*SECTOR_SIZE-
        shipDistance;

    const perspective=
        1/Math.max(.12,relative/1800);

    return {

        x:
            W*.5+
            o.x*perspective,

        y:
            H*.5+
            o.y*perspective,

        scale:
            perspective*o.size,

        distance:relative

    };
}


/* ==========================================================
   FONDO
========================================================== */

function galaxyBackground(){

    gctx.fillStyle="#000";
    gctx.fillRect(0,0,W,H);

    const grd=
        gctx.createRadialGradient(
            W*.5,H*.5,0,
            W*.5,H*.5,
            Math.max(W,H)
        );

    grd.addColorStop(0,"#090d24");
    grd.addColorStop(.45,"#03050e");
    grd.addColorStop(1,"#000");

    gctx.fillStyle=grd;
    gctx.fillRect(0,0,W,H);
}


/* ==========================================================
   ESTRELLAS DE FONDO
========================================================== */

function backgroundStars(time){

    for(let i=0;i<350;i++){

        const rs=
            seed+i*31.17;

        let x=
            hash(rs)*W;

        const y=
            hash(rs+55)*H;

        const depth=
            hash(rs+100);

        x-=
            shipDistance*
            (.00015+depth*.001);

        x=((x%W)+W)%W;

        const pulse=
            .4+
            .4*Math.sin(
                time*.001+
                hash(rs+200)*6
            );

        gctx.globalAlpha=
            pulse*(.25+depth*.65);

        gctx.fillStyle=
            depth>.94
            ? "#bcecff"
            : depth>.7
            ? "#ffffff"
            : "#777f9c";

        const size=
            depth>.8?1.5:1;

        gctx.fillRect(x,y,size,size);
    }

    gctx.globalAlpha=1;
}


/* ==========================================================
   GLOW
========================================================== */

function glow(ctx,x,y,r,color,a){

    const gr=
        ctx.createRadialGradient(
            x,y,0,
            x,y,r
        );

    gr.addColorStop(0,color);
    gr.addColorStop(.25,color);
    gr.addColorStop(1,"transparent");

    ctx.globalAlpha=a;
    ctx.fillStyle=gr;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=1;
}


/* ==========================================================
   ESTRELLA
========================================================== */

function drawStar(o,p){

    const r=
        Math.max(1.2,5*p.scale);

    glow(
        gctx,
        p.x,p.y,
        r*8,
        o.palette[1],
        .18
    );

    gctx.save();
    gctx.translate(p.x,p.y);

    gctx.fillStyle=o.palette[1];

    if(hash(o.seed)<.5){

        gctx.beginPath();

        gctx.moveTo(0,-r*3);
        gctx.lineTo(r*.6,-r*.6);
        gctx.lineTo(r*3,0);
        gctx.lineTo(r*.6,r*.6);
        gctx.lineTo(0,r*3);
        gctx.lineTo(-r*.6,r*.6);
        gctx.lineTo(-r*3,0);
        gctx.lineTo(-r*.6,-r*.6);

        gctx.closePath();
        gctx.fill();

    }else{

        gctx.beginPath();
        gctx.arc(0,0,r,0,Math.PI*2);
        gctx.fill();
    }

    gctx.restore();
}


/* ==========================================================
   PLANETA
========================================================== */

function drawPlanet(o,p){

    const r=
        Math.max(3,15*p.scale);

    gctx.save();

    gctx.translate(p.x,p.y);
    gctx.rotate(o.rotation);

    glow(
        gctx,0,0,
        r*3,
        o.palette[0],
        .12
    );

    gctx.fillStyle=o.palette[0];

    const shape=
        Math.floor(hash(o.seed+500)*5);

    gctx.beginPath();

    if(shape===0){

        gctx.arc(0,0,r,0,Math.PI*2);

    }else if(shape===1){

        gctx.rect(-r,-r,r*2,r*2);

    }else if(shape===2){

        for(let i=0;i<6;i++){

            const a=i*Math.PI/3;
            const x=Math.cos(a)*r;
            const y=Math.sin(a)*r;

            if(i===0)
                gctx.moveTo(x,y);
            else
                gctx.lineTo(x,y);
        }

        gctx.closePath();

    }else if(shape===3){

        gctx.moveTo(0,-r);
        gctx.lineTo(r,r);
        gctx.lineTo(-r,r);
        gctx.closePath();

    }else{

        gctx.moveTo(0,-r);
        gctx.lineTo(r,0);
        gctx.lineTo(0,r);
        gctx.lineTo(-r,0);
        gctx.closePath();
    }

    gctx.fill();

    gctx.globalAlpha=.3;
    gctx.fillStyle=o.palette[2];

    for(let i=0;i<3;i++){

        gctx.fillRect(
            -r,
            -r+i*r*.55,
            r*2,
            r*.12
        );
    }

    if(hash(o.seed+800)<.35){

        gctx.globalAlpha=.85;

        gctx.strokeStyle=o.palette[2];
        gctx.lineWidth=Math.max(1,r*.12);

        gctx.beginPath();

        gctx.ellipse(
            0,0,
            r*1.8,
            r*.55,
            0,0,Math.PI*2
        );

        gctx.stroke();
    }

    gctx.restore();
}


/* ==========================================================
   NEBULOSA
========================================================== */

function drawNebula(o,p,time){

    const R=100*p.scale;

    if(R<4)return;

    gctx.save();

    gctx.translate(p.x,p.y);
    gctx.rotate(o.rotation);

    const shape=
        Math.floor(hash(o.seed+11)*6);

    if(shape===0){

        for(let i=0;i<55;i++){

            const a=
                hash(o.seed+i*7)*Math.PI*2;

            const d=
                Math.sqrt(hash(o.seed+i*17))*R;

            glow(
                gctx,
                Math.cos(a)*d,
                Math.sin(a)*d*.55,
                R*(.04+hash(o.seed+i*29)*.16),
                o.palette[i%3],
                .07
            );
        }

    }else if(shape===1){

        for(let i=0;i<120;i++){

            const t=i/120*Math.PI*8;

            const d=
                R*.03+
                R*.85*(i/120);

            glow(
                gctx,
                Math.cos(t)*d,
                Math.sin(t)*d*.5,
                R*.055,
                o.palette[i%3],
                .08
            );
        }

    }else if(shape===2){

        for(let i=0;i<65;i++){

            const a=i/65*Math.PI*2;

            const d=
                R*.65+
                Math.sin(i*2.2)*R*.13;

            glow(
                gctx,
                Math.cos(a)*d,
                Math.sin(a)*d*.5,
                R*.09,
                o.palette[i%3],
                .1
            );
        }

    }else if(shape===3){

        for(let i=0;i<100;i++){

            const x=random(o.seed+i*2,-R,R);
            const y=random(o.seed+i*3,-R*.6,R*.6);

            glow(
                gctx,x,y,
                R*.06,
                o.palette[i%3],
                .065
            );
        }

    }else if(shape===4){

        for(let i=0;i<60;i++){

            const y=
                -R+
                i/60*R*2;

            const x=
                Math.sin(i*.7)*R*.4;

            glow(
                gctx,x,y,
                R*.13,
                o.palette[i%3],
                .08
            );
        }

    }else{

        for(let i=0;i<100;i++){

            const t=i/100*Math.PI*9;

            const d=
                R*.05+
                R*.75*(i/100);

            glow(
                gctx,
                Math.cos(t)*d,
                Math.sin(t)*d*.55,
                R*.055,
                o.palette[i%3],
                .075
            );
        }
    }

    gctx.restore();
}


/* ==========================================================
   GALAXIA
========================================================== */

function drawGalaxy(o,p,time){

    const R=100*p.scale;

    if(R<5)return;

    gctx.save();

    gctx.translate(p.x,p.y);
    gctx.rotate(o.rotation);

    glow(
        gctx,0,0,
        R*1.6,
        o.palette[1],
        .13
    );

    gctx.globalAlpha=.7;
    gctx.fillStyle=o.palette[2];

    gctx.beginPath();
    gctx.arc(0,0,R*.2,0,Math.PI*2);
    gctx.fill();

    for(let arm=0;arm<2;arm++){

        for(let i=0;i<110;i++){

            const t=
                i/110*Math.PI*5;

            const d=
                R*.06+
                R*.9*(i/110);

            const a=
                t+
                arm*Math.PI;

            gctx.globalAlpha=
                .1+
                (1-i/110)*.25;

            gctx.fillStyle=
                o.palette[i%3];

            gctx.fillRect(
                Math.cos(a)*d,
                Math.sin(a)*d*.38,
                Math.max(1,2*p.scale),
                Math.max(1,2*p.scale)
            );
        }
    }

    gctx.restore();
}


/* ==========================================================
   PÚLSAR
========================================================== */

function drawPulsar(o,p,time){

    const r=Math.max(4,8*p.scale);

    const pulse=
        .5+
        .5*Math.sin(
            time*.006+
            o.phase
        );

    glow(
        gctx,
        p.x,p.y,
        r*8,
        "#83ddff",
        .3
    );

    gctx.fillStyle="#efffff";

    gctx.beginPath();

    gctx.arc(
        p.x,p.y,
        r*(.7+pulse*.25),
        0,Math.PI*2
    );

    gctx.fill();

    gctx.save();

    gctx.translate(p.x,p.y);

    gctx.rotate(
        time*.001+
        o.rotation
    );

    gctx.globalAlpha=.2;

    gctx.fillStyle="#73dcff";

    gctx.beginPath();

    gctx.moveTo(0,0);
    gctx.lineTo(r*2,-r*.18);
    gctx.lineTo(r*15,-r*.025);
    gctx.lineTo(r*15,r*.025);
    gctx.lineTo(r*2,r*.18);

    gctx.closePath();
    gctx.fill();

    gctx.rotate(Math.PI);

    gctx.beginPath();

    gctx.moveTo(0,0);
    gctx.lineTo(r*2,-r*.18);
    gctx.lineTo(r*15,-r*.025);
    gctx.lineTo(r*15,r*.025);
    gctx.lineTo(r*2,r*.18);

    gctx.closePath();
    gctx.fill();

    gctx.restore();
}


/* ==========================================================
   CUÁSAR
========================================================== */

function drawQuasar(o,p,time){

    const r=Math.max(5,10*p.scale);

    glow(
        gctx,
        p.x,p.y,
        r*12,
        "#fff",
        .3
    );

    glow(
        gctx,
        p.x,p.y,
        r*4,
        o.palette[0],
        .35
    );

    gctx.save();

    gctx.translate(p.x,p.y);

    gctx.rotate(
        o.rotation+
        time*.0002
    );

    gctx.strokeStyle=o.palette[1];
    gctx.lineWidth=Math.max(1,r*.14);
    gctx.globalAlpha=.75;

    gctx.beginPath();

    gctx.ellipse(
        0,0,
        r*4,
        r,
        0,0,Math.PI*2
    );

    gctx.stroke();

    gctx.globalAlpha=.25;
    gctx.fillStyle=o.palette[2];

    gctx.beginPath();
    gctx.moveTo(0,-r);
    gctx.lineTo(r*.8,-r*13);
    gctx.lineTo(-r*.8,-r*13);
    gctx.closePath();
    gctx.fill();

    gctx.beginPath();
    gctx.moveTo(0,r);
    gctx.lineTo(r*.8,r*13);
    gctx.lineTo(-r*.8,r*13);
    gctx.closePath();
    gctx.fill();

    gctx.restore();
}


/* ==========================================================
   AGUJERO NEGRO
========================================================== */

function drawBlackHole(o,p,time){

    const r=Math.max(8,30*p.scale);

    gctx.save();

    gctx.translate(p.x,p.y);

    gctx.rotate(
        o.rotation+
        time*.00025
    );

    glow(
        gctx,0,0,
        r*3,
        "#ff7422",
        .12
    );

    gctx.strokeStyle="#ff9b43";
    gctx.lineWidth=Math.max(2,r*.17);
    gctx.globalAlpha=.8;

    gctx.beginPath();

    gctx.ellipse(
        0,0,
        r*2.3,
        r*.65,
        0,0,Math.PI*2
    );

    gctx.stroke();

    gctx.strokeStyle="#ffd08a";
    gctx.lineWidth=Math.max(1,r*.07);

    gctx.beginPath();

    gctx.ellipse(
        0,0,
        r*1.5,
        r*.42,
        0,0,Math.PI*2
    );

    gctx.stroke();

    gctx.fillStyle="#000";
    gctx.globalAlpha=1;

    gctx.beginPath();

    gctx.arc(
        0,0,r,
        0,Math.PI*2
    );

    gctx.fill();

    gctx.restore();
}


/* ==========================================================
   SUPERNOVA
========================================================== */

function drawSupernova(o,p,time){

    const age=
        (time*.0003+o.phase)%1;

    const r=
        10*p.scale+
        age*100*p.scale;

    const a=1-age;

    glow(
        gctx,
        p.x,p.y,
        r,
        o.palette[1],
        a*.3
    );

    gctx.save();

    gctx.translate(p.x,p.y);

    gctx.globalAlpha=a;

    gctx.strokeStyle=o.palette[2];

    for(let i=0;i<18;i++){

        const ang=
            i/18*Math.PI*2;

        gctx.beginPath();

        gctx.moveTo(
            Math.cos(ang)*r*.1,
            Math.sin(ang)*r*.1
        );

        gctx.lineTo(
            Math.cos(ang)*r,
            Math.sin(ang)*r
        );

        gctx.stroke();
    }

    gctx.restore();
}


/* ==========================================================
   COMETA
========================================================== */

function drawComet(o,p){

    const r=Math.max(2,6*p.scale);

    gctx.save();

    gctx.translate(p.x,p.y);
    gctx.rotate(o.rotation);

    const gr=
        gctx.createLinearGradient(
            -r*20,0,
            0,0
        );

    gr.addColorStop(0,"transparent");
    gr.addColorStop(.8,o.palette[1]);
    gr.addColorStop(1,"#fff");

    gctx.globalAlpha=.45;
    gctx.fillStyle=gr;

    gctx.beginPath();

    gctx.moveTo(-r*20,-r*.6);
    gctx.lineTo(0,-r*.15);
    gctx.lineTo(0,r*.15);
    gctx.lineTo(-r*20,r*.6);

    gctx.closePath();
    gctx.fill();

    gctx.globalAlpha=1;
    gctx.fillStyle="#fff";

    gctx.beginPath();
    gctx.arc(0,0,r,0,Math.PI*2);
    gctx.fill();

    gctx.restore();
}


/* ==========================================================
   ASTEROIDE
========================================================== */

function drawAsteroid(o,p){

    const r=Math.max(2,8*p.scale);

    gctx.save();

    gctx.translate(p.x,p.y);
    gctx.rotate(o.rotation);

    gctx.fillStyle="#72747c";

    gctx.beginPath();

    for(let i=0;i<8;i++){

        const a=i/8*Math.PI*2;

        const rr=
            r*(.6+
            hash(o.seed+i)*.5);

        const x=Math.cos(a)*rr;
        const y=Math.sin(a)*rr;

        if(i===0)
            gctx.moveTo(x,y);
        else
            gctx.lineTo(x,y);
    }

    gctx.closePath();
    gctx.fill();

    gctx.restore();
}


/* ==========================================================
   ANOMALÍA
========================================================== */

function drawAnomaly(o,p,time){

    const r=Math.max(8,22*p.scale);

    gctx.save();

    gctx.translate(p.x,p.y);
    gctx.rotate(time*.0007);

    for(let i=0;i<5;i++){

        gctx.rotate(Math.PI/2.5);

        gctx.strokeStyle=
            palettes[i%palettes.length][i%3];

        gctx.globalAlpha=.5;
        gctx.lineWidth=2;

        gctx.beginPath();

        gctx.moveTo(0,-r*.2);
        gctx.lineTo(r,r);
        gctx.lineTo(-r,r*.4);
        gctx.closePath();

        gctx.stroke();
    }

    gctx.restore();
}


/* ==========================================================
   DIBUJAR OBJETO
========================================================== */

function drawGalaxyObject(o,time){

    const p=projectGalaxy(o);

    if(
        p.x<-400 ||
        p.x>W+400 ||
        p.y<-400 ||
        p.y>H+400
    )
        return;

    if(p.distance<-1000)
        return;

    switch(o.type){

        case "star":
            drawStar(o,p);
            break;

        case "planet":
            drawPlanet(o,p);
            break;

        case "nebula":
            drawNebula(o,p,time);
            break;

        case "galaxy":
            drawGalaxy(o,p,time);
            break;

        case "pulsar":
            drawPulsar(o,p,time);
            break;

        case "quasar":
            drawQuasar(o,p,time);
            break;

        case "blackhole":
            drawBlackHole(o,p,time);
            break;

        case "supernova":
            drawSupernova(o,p,time);
            break;

        case "comet":
            drawComet(o,p);
            break;

        case "asteroid":
            drawAsteroid(o,p);
            break;

        case "anomaly":
            drawAnomaly(o,p,time);
            break;
    }
}


/* ==========================================================
   HIPERVELOCIDAD
========================================================== */

function hyperspace(){

    gctx.globalAlpha=.2;

    const amount=
        Math.floor(shipSpeed*15);

    for(let i=0;i<amount;i++){

        const a=
            hash(
                seed+
                i*33+
                Math.floor(shipDistance)
            )*
            Math.PI*2;

        const r1=
            20+
            hash(i+44)*300;

        const r2=
            r1+
            shipSpeed*40;

        gctx.strokeStyle="#b8ddff";

        gctx.beginPath();

        gctx.moveTo(
            W*.5+Math.cos(a)*r1,
            H*.5+Math.sin(a)*r1
        );

        gctx.lineTo(
            W*.5+Math.cos(a)*r2,
            H*.5+Math.sin(a)*r2
        );

        gctx.stroke();
    }

    gctx.globalAlpha=1;
}

let lastTime=performance.now();

        Math.min(50,time-lastTime);

        shipDistance+=
            shipSpeed*
            dt*
            .045;

        document.getElementById("distance")
            .textContent=
            Math.floor(shipDistance);

        document.getElementById("speed")
            .textContent=
            shipSpeed.toFixed(1);

        updateGalaxy();
    }

    galaxyBackground();
    backgroundStars(time);

    /*
       Lejanos primero.
    */

    galaxyObjects.sort((a,b)=>{

        const da=
            a.sector*SECTOR_SIZE-
            shipDistance;

        const db=
            b.sector*SECTOR_SIZE-
            shipDistance;

        return db-da;
    });

    for(const o of galaxyObjects)
        drawGalaxyObject(o,time);

    hyperspace();

    requestAnimationFrame(galaxyLoop);
}

/* ==========================================================
   SELECCIÓN DE OBJETOS
========================================================== */

function findObjectAt(x,y){

    let best=null;
    let bestD=Infinity;

    for(const o of galaxyObjects){

        const p=projectGalaxy(o);

        if(p.distance<0)
            continue;

        const dx=p.x-x;
        const dy=p.y-y;

        const d=Math.sqrt(dx*dx+dy*dy);

        const radius=
            Math.max(12,25*p.scale);

        if(d<radius && d<bestD){

            best=o;
            bestD=d;
        }
    }

    return best;
}

/* ==========================================================
   VIAJE AL OBJETO
========================================================== */

function approachObject(o){

    paused=true;

    document.getElementById("targetType")
        .textContent=
        "ACELERACIÓN HIPERESPACIAL";

    let progress=0;

    const startDistance=shipDistance;

    /*
       El objeto debe llegar visualmente
       al centro.
    */

    const targetSector=
        o.sector*SECTOR_SIZE+
        500;

    const targetDistance=
        Math.max(
            shipDistance+100,
            targetSector
        );

    const duration=2300;

    const start=performance.now();

    function travel(t){

        const k=
            Math.min(
                1,
                (t-start)/duration
            );

        /*
           Ease in/out.
        */

        const e=
            k<.5
            ? 2*k*k
            : 1-Math.pow(-2*k+2,2)/2;

        shipDistance=
            startDistance+
            (targetDistance-startDistance)*e;

        shipSpeed=
            1+
            e*4;

        /*
           Inclinar barco.
        */

        const ship=
            document.getElementById("ship");

        ship.style.transform=
            "translateX(-50%) rotate("+
            Math.sin(k*Math.PI)*8+
            "deg) scale("+
            (1+k*.12)+")";

        if(k<1){

            requestAnimationFrame(travel);

        }else{

            shipSpeed=1;

            ship.style.transform=
                "translateX(-50%)";

            createSystemForObject(o);
        }
    }

    requestAnimationFrame(travel);
}

/* ==========================================================
   SISTEMA MODE
========================================================== */

let systemMode=false;


/*
   Sobrescribimos la proyección mientras
   estamos observando el sistema.
*/

const originalProjectGalaxy=
    projectGalaxy;

function projectSystem(o){

    if(!systemMode)
        return originalProjectGalaxy(o);

    return {

        x:
            W*.5+
            o.x,

        y:
            H*.5+
            o.y,

        scale:
            o.size,

        distance:1000
    };
}


/*
   Selección de planetas del sistema.
*/

function findSystemPlanet(x,y){

    for(const o of galaxyObjects){

        if(!o.systemPlanet)
            continue;

        const p=projectSystem(o);

        const dx=p.x-x;
        const dy=p.y-y;

        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<
            Math.max(
                18,
                30*p.scale
            )
        ){
            return o;
        }
    }

    return null;
}


galaxyCanvas.addEventListener(

            findSystemPlanet(

                e.clientY

);

/* ==========================================================
   RAYCASTER 2.5D
========================================================== */

const MAP_W=24;
const MAP_H=24;

let worldMap=[];

let player={
    x:12.5,
    y:12.5,
    angle:0,
    z:0,
    vz:0
};

const PLAYER_HEIGHT=1.7;

const GRAVITY=8.5;

let keys={};

let moveX=0;
let moveY=0;

let lookDX=0;
let lookDY=0;

let cameraPitch=0;

const FOV=
    Math.PI/3;

const RAYS=
    Math.min(
        500,
        Math.max(
            240,
            Math.floor(W*.75)
        )
    );

let zBuffer=
    new Float32Array(RAYS);


/* ==========================================================
   GENERACIÓN DEL PLANETA
========================================================== */

function createPlanetWorld(o){

    const s=o.seed;

    worldMap=[];

    /*
       Primero todo vacío.
    */

    for(let y=0;y<MAP_H;y++){

        worldMap[y]=[];

        for(let x=0;x<MAP_W;x++){

            worldMap[y][x]=1;
        }
    }

    /*
       Crear caminos conectados mediante
       random walk.
    */

    let x=
        2+
        Math.floor(hash(s)*5);

    let y=
        2+
        Math.floor(hash(s+2)*5);

    const startX=x;
    const startY=y;

    for(let i=0;i<300;i++){

        worldMap[y][x]=0;

        /*
           Crear pequeñas habitaciones.
        */

        if(hash(s+i*4)<.25){

            const rw=
                2+
                Math.floor(hash(s+i*5)*4);

            const rh=
                2+
                Math.floor(hash(s+i*6)*4);

            for(let yy=-rh;yy<=rh;yy++){

                for(let xx=-rw;xx<=rw;xx++){

                    const nx=x+xx;
                    const ny=y+yy;

                    if(
                        nx>1 &&
                        nx<MAP_W-2 &&
                        ny>1 &&
                        ny<MAP_H-2
                    ){
                        worldMap[ny][nx]=0;
                    }
                }
            }
        }

        const dir=
            Math.floor(
                hash(s+i*10)*4
            );

        if(dir===0)x++;
        if(dir===1)x--;
        if(dir===2)y++;
        if(dir===3)y--;

        x=Math.max(
            1,
            Math.min(MAP_W-2,x)
        );

        y=Math.max(
            1,
            Math.min(MAP_H-2,y)
        );
    }

    /*
       Garantizar borde sólido.
    */

    for(let i=0;i<MAP_W;i++){

        worldMap[0][i]=1;
        worldMap[MAP_H-1][i]=1;
    }

    for(let i=0;i<MAP_H;i++){

        worldMap[i][0]=1;
        worldMap[i][MAP_W-1]=1;
    }

    /*
       Posición del jugador.
    */

    player.x=startX+.5;
    player.y=startY+.5;

    /*
       Buscar celda libre si la inicial quedó cerrada.
    */

    if(isWall(
        Math.floor(player.x),
        Math.floor(player.y)
    )){

        outer:
        for(let yy=1;yy<MAP_H-1;yy++){

            for(let xx=1;xx<MAP_W-1;xx++){

                if(worldMap[yy][xx]===0){

                    player.x=xx+.5;
                    player.y=yy+.5;

                    break outer;
                }
            }
        }
    }

    player.angle=0;
    player.z=0;
    player.vz=0;
    cameraPitch=0;

    document.getElementById("planetName")
        .textContent=
        "PLANETA "+
        Math.floor(hash(s)*99999);

    updateMinimap();
}


/* ==========================================================
   COLISIONES
========================================================== */

function isWall(x,y){

    if(
        x<0 ||
        y<0 ||
        x>=MAP_W ||
        y>=MAP_H
    )
        return true;

    return worldMap[y][x]===1;
}


function blocked(x,y){

    const radius=.18;

    return (
        isWall(
            Math.floor(x-radius),
            Math.floor(y-radius)
        ) ||
        isWall(
            Math.floor(x+radius),
            Math.floor(y-radius)
        ) ||
        isWall(
            Math.floor(x-radius),
            Math.floor(y+radius)
        ) ||
        isWall(
            Math.floor(x+radius),
            Math.floor(y+radius)
        )
    );
}


/* ==========================================================
   DDA RAYCAST
========================================================== */

function castRay(rayAngle){

    const dirX=Math.cos(rayAngle);
    const dirY=Math.sin(rayAngle);

    let mapX=
        Math.floor(player.x);

    let mapY=
        Math.floor(player.y);

    const deltaX=
        Math.abs(1/(dirX||.000001));

    const deltaY=
        Math.abs(1/(dirY||.000001));

    let stepX;
    let stepY;

    let sideX;
    let sideY;

    if(dirX<0){

        stepX=-1;

        sideX=
            (player.x-mapX)*deltaX;

    }else{

        stepX=1;

        sideX=
            (mapX+1-player.x)*deltaX;
    }

    if(dirY<0){

        stepY=-1;

        sideY=
            (player.y-mapY)*deltaY;

    }else{

        stepY=1;

        sideY=
            (mapY+1-player.y)*deltaY;
    }

    let side=0;

    let distance=0;

    for(let i=0;i<100;i++){

        if(sideX<sideY){

            sideX+=deltaX;
            mapX+=stepX;
            side=0;

        }else{

            sideY+=deltaY;
            mapY+=stepY;
            side=1;
        }

        if(isWall(mapX,mapY))
            break;
    }

    if(side===0)
        distance=
            (mapX-player.x+
            (1-stepX)/2)/
            dirX;
    else
        distance=
            (mapY-player.y+
            (1-stepY)/2)/
            dirY;

    return {
        distance:Math.max(.001,distance),
        side
    };
}


/* ==========================================================
   RENDER RAYCASTER
========================================================== */

function renderWorld(){

    /*
       Cielo.
    */

    const ceiling=
        wctx.createLinearGradient(
            0,0,
            0,H*.5
        );

    ceiling.addColorStop(
        0,
        "#050712"
    );

    ceiling.addColorStop(
        1,
        "#11162c"
    );

    wctx.fillStyle=ceiling;

    wctx.fillRect(
        0,0,W,H*.55
    );

    /*
       Suelo.
    */

    const floor=
        wctx.createLinearGradient(
            0,H*.5,
            0,H
        );

    floor.addColorStop(
        0,
        "#161218"
    );

    floor.addColorStop(
        1,
        "#050508"
    );

    wctx.fillStyle=floor;

    wctx.fillRect(
        0,H*.5,
        W,H*.5
    );

    const pitch=
        cameraPitch;

    /*
       Rayos.
    */

    for(let r=0;r<RAYS;r++){

        const cameraX=
            2*r/RAYS-1;

        const rayAngle=
            player.angle+
            Math.atan(
                cameraX*
                Math.tan(FOV/2)
            );

        const hit=
            castRay(rayAngle);

        /*
           Corrección fish-eye.
        */

        const corrected=
            hit.distance*
            Math.cos(
                rayAngle-player.angle
            );

        zBuffer[r]=corrected;

        const wallHeight=
            H/
            Math.max(
                .001,
                corrected
            );

        const horizon=
            H*.5+
            pitch+
            player.z*90;

        const top=
            horizon-
            wallHeight/2;

        const bottom=
            horizon+
            wallHeight/2;

        /*
           Color según profundidad.
        */

        const shade=
            Math.max(
                .12,
                1-corrected*.035
            );

        let base;

        if(hit.side===0)
            base=[130,92,61];
        else
            base=[100,70,48];

        const rr=
            Math.floor(base[0]*shade);

        const gg=
            Math.floor(base[1]*shade);

        const bb=
            Math.floor(base[2]*shade);

        wctx.fillStyle=
            `rgb(${rr},${gg},${bb})`;

        const columnWidth=
            W/RAYS+1;

        wctx.fillRect(
            r*W/RAYS,
            top,
            columnWidth,
            bottom-top
        );
    }

    /*
       Detalles horizontales del suelo.
    */

    wctx.globalAlpha=.08;

    for(let i=1;i<12;i++){

        const yy=
            H*.5+
            Math.pow(i/12,1.8)*
            H*.5;

        wctx.strokeStyle="#ffffff";

        wctx.beginPath();

        wctx.moveTo(0,yy);
        wctx.lineTo(W,yy);

        wctx.stroke();
    }

    wctx.globalAlpha=1;

    /*
       Retícula.
    */

    wctx.strokeStyle="rgba(255,255,255,.35)";
    wctx.lineWidth=1;

    wctx.beginPath();
    wctx.moveTo(W*.5-7,H*.5);
    wctx.lineTo(W*.5+7,H*.5);
    wctx.moveTo(W*.5,H*.5-7);
    wctx.lineTo(W*.5,H*.5+7);
    wctx.stroke();
}


/* ==========================================================
   MOVIMIENTO
========================================================== */

function updatePlayer(dt){

    let forward=
        -moveY;

    let strafe=
        moveX;

    /*
       Teclado.
    */

    if(keys["KeyW"])
        forward+=1;

    if(keys["KeyS"])
        forward-=1;

    if(keys["KeyA"])
        strafe-=1;

    if(keys["KeyD"])
        strafe+=1;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>1){

        forward/=length;
        strafe/=length;
    }

    const speedMove=
        2.8*dt;

    const dx=
        (
            Math.cos(player.angle)*forward-
            Math.sin(player.angle)*strafe
        )*speedMove;

    const dy=
        (
            Math.sin(player.angle)*forward+
            Math.cos(player.angle)*strafe
        )*speedMove;

    const nx=
        player.x+dx;

    const ny=
        player.y+dy;

    if(!blocked(nx,player.y))
        player.x=nx;

    if(!blocked(player.x,ny))
        player.y=ny;

    /*
       Gravedad.
    */

    player.vz-=GRAVITY*dt;

    player.z+=player.vz*dt;

    if(player.z<0){

        player.z=0;
        player.vz=0;
    }

    document.getElementById("worldPos")
        .textContent=
        player.x.toFixed(1)+
        ", "+
        player.y.toFixed(1);
}


/* ==========================================================
   SALTO
========================================================== */

function jump(){

    if(player.z<=.001){

        player.vz=4.3;
    }
}


/* ==========================================================
   DASH
========================================================== */

function dash(){

    const d=1.4;

    const nx=
        player.x+
        Math.cos(player.angle)*d;

    const ny=
        player.y+
        Math.sin(player.angle)*d;

    if(!blocked(nx,ny)){

        player.x=nx;
        player.y=ny;
    }
}


/* ==========================================================
   TECLADO
========================================================== */

addEventListener("keydown",e=>{

    keys[e.code]=true;

    if(e.code==="Space")
        jump();

    if(e.code==="ShiftLeft")
        dash();

    if(e.code==="Escape")
        returnToGalaxy();
});

addEventListener("keyup",e=>{

    keys[e.code]=false;
});


/* ==========================================================
   CÁMARA MOUSE
========================================================== */

let mouseDown=false;
let lastMouseX=0;
let lastMouseY=0;

worldCanvas.addEventListener(
    "pointerdown",
    e=>{

        mouseDown=true;

        lastMouseX=e.clientX;
        lastMouseY=e.clientY;
    }
);

addEventListener(
    "pointerup",
    ()=>{
        mouseDown=false;
    }
);

addEventListener(
    "pointermove",
    e=>{

        if(!mouseDown || mode!=="world")
            return;

        const dx=
            e.clientX-lastMouseX;

        const dy=
            e.clientY-lastMouseY;

        lastMouseX=e.clientX;
        lastMouseY=e.clientY;

        player.angle+=
            dx*.004;

        /*
           Cámara vertical.
        */

        cameraPitch-=
            dy*.8;

        cameraPitch=
            Math.max(
                -120,
                Math.min(
                    120,
                    cameraPitch
                )
            );
    }
);


/* ==========================================================
   JOYSTICK
========================================================== */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joyPointer=null;

joystick.addEventListener(
    "pointerdown",
    e=>{

        joyPointer=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId!==joyPointer)
            return;

        updateJoystick(e);
    }
);

function updateJoystick(e){

    const rect=
        joystick.getBoundingClientRect();

    const cx=
        rect.left+rect.width/2;

    const cy=
        rect.top+rect.height/2;

    let dx=e.clientX-cx;
    let dy=e.clientY-cy;

    const max=45;

    const len=
        Math.hypot(dx,dy);

    if(len>max){

        dx=dx/len*max;
        dy=dy/len*max;
    }

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;

    moveX=dx/max;
    moveY=dy/max;
}

function resetJoystick(){

    joyPointer=null;

    stick.style.transform=
        "translate(0,0)";

    moveX=0;
    moveY=0;
}

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* ==========================================================
   CÁMARA TÁCTIL DERECHA
========================================================== */

let touchLook=false;
let touchLX=0;
let touchLY=0;

worldCanvas.addEventListener(
    "touchstart",
    e=>{

        for(const t of e.changedTouches){

            if(t.clientX>W*.42){

                touchLook=true;

                touchLX=t.clientX;
                touchLY=t.clientY;
            }
        }

    },
    {passive:false}
);

worldCanvas.addEventListener(
    "touchmove",
    e=>{

        if(!touchLook)
            return;

        e.preventDefault();

        const t=
            e.changedTouches[0];

        const dx=
            t.clientX-touchLX;

        const dy=
            t.clientY-touchLY;

        touchLX=t.clientX;
        touchLY=t.clientY;

        player.angle+=
            dx*.005;

        cameraPitch-=
            dy*.75;

        cameraPitch=
            Math.max(
                -120,
                Math.min(
                    120,
                    cameraPitch
                )
            );
    },
    {passive:false}
);

worldCanvas.addEventListener(
    "touchend",
    ()=>{
        touchLook=false;
    }
);


/* ==========================================================
   BOTONES
========================================================== */

document.getElementById("jump")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        jump();
    }
);

document.getElementById("dash")
.addEventListener(
    "pointerdown",

    }

document.getElementById("backGalaxy")

/* ==========================================================
   MINIMAPA
========================================================== */

function updateMinimap(){

    const size=145;

    mctx.clearRect(
        0,0,size,size
    );

    mctx.fillStyle="#030405";

    mctx.fillRect(
        0,0,size,size
    );

    const scale=
        Math.min(
            size/MAP_W,
            size/MAP_H
        );

    for(let y=0;y<MAP_H;y++){

        for(let x=0;x<MAP_W;x++){

            mctx.fillStyle=
                worldMap[y][x]
                ? "#7d6244"
                : "#15151b";

            mctx.fillRect(
                x*scale,
                y*scale,
                scale+.5,
                scale+.5
            );
        }
    }

    mctx.fillStyle="#fff";

    mctx.beginPath();

    mctx.arc(
        player.x*scale,
        player.y*scale,
        3,
        0,
        Math.PI*2
    );

    mctx.fill();

    mctx.strokeStyle="#fff";

    mctx.beginPath();

    mctx.moveTo(
        player.x*scale,
        player.y*scale
    );

    mctx.lineTo(
        (player.x+
        Math.cos(player.angle)*1.5)*scale,
        (player.y+
        Math.sin(player.angle)*1.5)*scale
    );

    mctx.stroke();
}


/* ==========================================================
   LOOP MUNDO
========================================================== */

let lastWorld=performance.now();

function worldLoop(now){

    const dt=
        Math.min(
            .05,
            (now-lastWorld)/1000
        );

    lastWorld=now;

    if(mode==="world"){

        updatePlayer(dt);
        renderWorld();

        /*
           El minimapa no necesita actualizarse
           cada frame.
        */

        if(
            Math.floor(now/100)%2===0
        )
            updateMinimap();
    }

    requestAnimationFrame(worldLoop);
}

requestAnimationFrame(worldLoop);


/* ==========================================================
   VOLVER AL UNIVERSO
========================================================== */

function returnToGalaxy(){

    const fade=
        document.getElementById("fade");

    fade.style.opacity=1;

    setTimeout(()=>{

        mode="galaxy";

        galaxyCanvas.style.display="block";
        worldCanvas.style.display="none";

        document.getElementById("hud")
            .style.display="block";

        document.getElementById("worldHud")
            .style.display="none";

        document.getElementById("target")
            .style.opacity=0;

        setTimeout(()=>{
            fade.style.opacity=0;
        },300);

    },500);
}
