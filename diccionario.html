<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario de las Cuatro Lenguas</title>

    <style>
        /* =========================================================
   DICCIONARIO — ESTILOS
   ========================================================= */

        :root {
            --bg: #0b0d0c;
            --panel: #141816;
            --panel2: #1b211e;
            --line: #303a34;
            --text: #f1f4ef;
            --muted: #9ca89f;
            --gold: #d6b56d;
            --green: #79a978;
            --blue: #759bbd;
            --purple: #a58bc5;
            --red: #c98787;
            --shadow: 0 12px 35px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 20% 0%, rgba(121, 169, 120, .08), transparent 30%),
                radial-gradient(circle at 90% 10%, rgba(214, 181, 109, .07), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 35px 20px 25px;
            text-align: center;
            border-bottom: 1px solid var(--line);
            background: rgba(10, 12, 11, .75);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 7px;
        }

        .container {
            width: min(1250px, 94%);
            margin: 25px auto 70px;
        }

        /* ---------------------------------------------------------
   IDIOMAS
   --------------------------------------------------------- */

        .languages {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .lang {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            padding: 16px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: .2s;
            font-size: 15px;
        }

        .lang:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
        }

        .lang.active {
            border-color: var(--gold);
            background: linear-gradient(145deg, #24261f, #171a17);
            box-shadow: 0 0 0 1px rgba(214, 181, 109, .12);
        }

        .langSymbol {
            display: block;
            font-size: 25px;
            margin-bottom: 5px;
        }

        /* ---------------------------------------------------------
   BUSCADOR
   --------------------------------------------------------- */

        .searchBox {
            position: relative;
            margin-bottom: 16px;
        }

        .searchBox input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--line);
            color: white;
            border-radius: 14px;
            padding: 17px 20px 17px 50px;
            outline: none;
            font-size: 17px;
        }

        .searchBox input:focus {
            border-color: var(--gold);
        }

        .searchIcon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        /* ---------------------------------------------------------
   LETRAS
   --------------------------------------------------------- */

        .alphabet {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 14px;
        }

        .letter {
            min-width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .letter:hover,
        .letter.active {
            background: var(--gold);
            color: #17140d;
            border-color: var(--gold);
        }

        /* ---------------------------------------------------------
   CATEGORÍAS
   --------------------------------------------------------- */

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .category {
            white-space: nowrap;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            border-radius: 30px;
            padding: 9px 15px;
            cursor: pointer;
        }

        .category.active {
            background: var(--panel2);
            color: var(--gold);
            border-color: var(--gold);
        }

        /* ---------------------------------------------------------
   CABECERA DE RESULTADOS
   --------------------------------------------------------- */

        .resultHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: 25px 0 12px;
        }

        .resultHeader h2 {
            margin: 0;
        }

        .count {
            color: var(--muted);
            font-size: 14px;
        }

        /* ---------------------------------------------------------
   TARJETAS
   --------------------------------------------------------- */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 13px;
        }

        .card {
            background:
                linear-gradient(145deg, rgba(255, 255, 255, .025), transparent),
                var(--panel);
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 19px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .15);
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #59655d;
        }

        .word {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .translit {
            color: var(--gold);
            font-size: 15px;
            margin-bottom: 9px;
        }

        .meaning {
            font-size: 17px;
        }

        .type {
            display: inline-block;
            margin-top: 13px;
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--line);
            padding: 4px 8px;
            border-radius: 20px;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 15px;
        }

        /* ---------------------------------------------------------
   NÚMEROS
   --------------------------------------------------------- */

        .numbers {
            display: none;
        }

        .numberGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 10px;
        }

        .number {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 14px;
            border-radius: 12px;
        }

        .numberValue {
            color: var(--gold);
            font-size: 13px;
        }

        .numberWord {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* ---------------------------------------------------------
   MODAL
   --------------------------------------------------------- */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modalBox {
            width: min(600px, 100%);
            background: #151a17;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .close {
            position: absolute;
            right: 17px;
            top: 14px;
            border: 0;
            background: none;
            color: var(--muted);
            font-size: 28px;
            cursor: pointer;
        }

        .modalWord {
            font-size: 42px;
            font-weight: 800;
        }

        .modalTranslit {
            color: var(--gold);
            font-size: 18px;
            margin: 4px 0 20px;
        }

        .modalMeaning {
            font-size: 23px;
            margin-bottom: 15px;
        }

        .modalInfo {
            color: var(--muted);
            line-height: 1.7;
        }

        /* ---------------------------------------------------------
   COMPARADOR
   --------------------------------------------------------- */

        .compare {
            margin-top: 35px;
        }

        .compareBox {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .compareItem {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 15px;
        }

        .compareLang {
            color: var(--muted);
            font-size: 12px;
        }

        .compareWord {
            font-size: 21px;
            font-weight: 700;
            margin-top: 5px;
        }

        @media(max-width:800px) {
            .languages {
                grid-template-columns: repeat(2, 1fr);
            }

            .compareBox {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                position: relative;
            }
        }

        @media(max-width:500px) {
            .container {
                width: 92%;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .numberGrid {
                grid-template-columns: repeat(2, 1fr);
            }

            .compareBox {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>

        /* =========================================================
           NORMALIZAR TEXTO
           ========================================================= */

        function normalize(text) {

            return text
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");

        }


        /* =========================================================
           INICIAL DE PALABRA
           ========================================================= */

        function getInitial(entry) {

            const word = entry.word;

            if (currentLang === "map") {

                const lower = word.toLowerCase();

                if (lower.startsWith("ng")) return "Ng";
                if (lower.startsWith("ch")) return "Ch";
                if (lower.startsWith("tr")) return "Tr";

                return word.charAt(0).toUpperCase();
            }

            if (currentLang === "sa") {
                return word.charAt(0);
            }

            if (currentLang === "syr") {
                return word.charAt(0);
            }

            return normalize(word).charAt(0).toUpperCase();
        }


        /* =========================================================
           ALFABETO
           ========================================================= */

        function renderAlphabet() {

            alphabetEl.innerHTML = "";

            const letters = LANGS[currentLang].alphabet;

            const all = document.createElement("button");
            all.className = "letter " + (currentLetter === "ALL" ? "active" : "");
            all.textContent = "★";

            all.onclick = () => {
                currentLetter = "ALL";
                render();
            };

            alphabetEl.appendChild(all);

            letters.forEach(letter => {

                const btn = document.createElement("button");

                btn.className =
                    "letter " +
                    (currentLetter === letter ? "active" : "");

                btn.textContent = letter;

                btn.onclick = () => {

                    currentLetter = letter;
                    render();

                };

                alphabetEl.appendChild(btn);

            });

        }

                button.className =

                button.textContent =
                    cat.charAt(0).toUpperCase() + cat.slice(1);

                categoriesEl.appendChild(button);

        /* =========================================================
           RENDERIZAR PALABRAS
           ========================================================= */

        function renderWords() {

            resultsEl.innerHTML = "";

            let data = DATA[currentLang] || [];

            let filtered = data.filter(entry => {

                const matchesLetter =
                    currentLetter === "ALL" ||
                    getInitial(entry) === currentLetter;

                const matchesCategory =
                    currentCategory === "TODAS" ||
                    entry.cat === currentCategory;

                const q = normalize(currentSearch);

                const matchesSearch =
                    !q ||
                    normalize(entry.word).includes(q) ||
                    normalize(entry.meaning).includes(q) ||
                    normalize(entry.latin || "").includes(q);

                return matchesLetter &&
                    matchesCategory &&
                    matchesSearch;

            });

            countEl.textContent =
                filtered.length + " entradas";

            if (currentSearch) {
                sectionTitle.textContent = "Resultados";
            } else if (currentLetter !== "ALL") {
                sectionTitle.textContent = "Letra " + currentLetter;
            } else {
                sectionTitle.textContent = "Palabras";
            }

            if (!filtered.length) {

                resultsEl.innerHTML = `
      <div class="empty">
        No hay entradas para esta búsqueda.
      </div>
    `;

                return;
            }

            filtered.forEach(entry => {

                const card = document.createElement("article");

                card.className = "card";

                card.innerHTML = `

      <div class="word">${entry.word}</div>

      ${entry.latin
                        ? `<div class="translit">${entry.latin}</div>`
                        : ""
                    }

      <div class="meaning">${entry.meaning}</div>

      <div class="type">${entry.type}</div>

    `;

                card.onclick = () => openModal(entry);

                resultsEl.appendChild(card);

            });

        }

                compareBox.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        Escribe una palabra o significado para comparar
        las cuatro lenguas.
      </div>
    `;

                return;
            }

            const q = normalize(currentSearch);

            const langs = ["es", "map", "sa", "syr"];

            langs.forEach(lang => {

                const data = DATA[lang];

                const found = data.find(entry =>

                    normalize(entry.word).includes(q) ||
                    normalize(entry.meaning).includes(q) ||
                    normalize(entry.latin || "").includes(q)

                );

                const div = document.createElement("div");

                div.className = "compareItem";

                if (found) {

                    div.innerHTML = `

        <div class="compareLang">
          ${LANGS[lang].symbol}
          ${LANGS[lang].name}
        </div>

        <div class="compareWord">
          ${found.word}
        </div>

        ${found.latin
                            ? `<div class="translit">${found.latin}</div>`
                            : ""
                        }

        <div>${found.meaning}</div>
      `;

                } else {

                    div.innerHTML = `

        <div class="compareLang">
          ${LANGS[lang].symbol}
          ${LANGS[lang].name}
        </div>

        <div class="compareWord">—</div>

        <div class="compareLang">
          No encontrada
        </div>

      `;

                }

                compareBox.appendChild(div);

            });

        }


        /* =========================================================
           MODAL
           ========================================================= */

        function openModal(entry) {

            document.getElementById("modalWord").textContent =
                entry.word;

            document.getElementById("modalTranslit").textContent =
                entry.latin || "";

            document.getElementById("modalMeaning").textContent =
                entry.meaning;

            document.getElementById("modalInfo").innerHTML = `

    <strong>Idioma:</strong>
    ${LANGS[currentLang].name}
    <br>

    <strong>Categoría:</strong>
    ${entry.cat}
    <br>

    <strong>Tipo:</strong>
    ${entry.type}

  `;

            document.getElementById("modal").classList.add("show");

        }

        document.getElementById("closeModal").onclick = () => {

            document.getElementById("modal").classList.remove("show");

        };

        document.getElementById("modal").onclick = e => {

            if (e.target.id === "modal") {

                document.getElementById("modal").classList.remove("show");

            }

        };


        /* =========================================================
           CAMBIO DE IDIOMA
           ========================================================= */

        document.querySelectorAll(".lang").forEach(button => {

            button.onclick = () => {

                document.querySelectorAll(".lang")
                    .forEach(b => b.classList.remove("active"));

                button.classList.add("active");

                currentLang = button.dataset.lang;

                currentLetter = "ALL";
                currentCategory = "TODAS";

                searchEl.value = "";
                currentSearch = "";

                render();

            };

        });


        /* =========================================================
           BUSCADOR
           ========================================================= */

        searchEl.addEventListener("input", () => {

            currentSearch = searchEl.value;

            render();

        });


        /* =========================================================
           RENDER PRINCIPAL
           ========================================================= */

        function render() {

            renderAlphabet();
            renderCategories();
            renderWords();
            renderNumbers();
            renderCompare();

        }


        /* =========================================================
           INICIAR
           ========================================================= */

        render();

    </script>

</body>

</html>
